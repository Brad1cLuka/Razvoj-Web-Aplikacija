<div class="page-title">
  <h1>Kontaktirajte nas</h1>
  <p>Voleli bismo da čujemo Vaše mišljenje 📩</p>
</div>

<section class="contact-container">

  <div class="contact-info">
    <h2>Stupite u kontakt sa nama</h2>
    <p>Pitajte nas bilo šta o našem medu 🍯</p>

    <p><strong>Email:</strong> info@honey-shop.com</p>
    <p><strong>Telefon:</strong> +381 60 123 456</p>
  </div>

  <form class="contact-form" (ngSubmit)="submitForm(form)" #form="ngForm">

    <input 
      type="text" 
      name="name" 
      placeholder="Vaše ime"
      [(ngModel)]="formData.name"
      required
      #name="ngModel"
    >
    <div class="error" *ngIf="name.invalid && name.touched">
      Ime je obavezno
    </div>

    <input 
      type="email" 
      name="email" 
      placeholder="Vaša email adresa"
      [(ngModel)]="formData.email"
      required
      email
      #email="ngModel"
    >
    <div class="error" *ngIf="email.invalid && email.touched">
      Unesite ispravnu email adresu
    </div>

    <textarea 
      name="message" 
      rows="5"
      placeholder="Vaša poruka"
      [(ngModel)]="formData.message"
      required
      #message="ngModel"
    ></textarea>
    <div class="error" *ngIf="message.invalid && message.touched">
      Poruka je obavezna
    </div>

    <button type="submit" [disabled]="loading || form.invalid">
      
      <span *ngIf="!loading">Pošalji poruku</span>

      <span *ngIf="loading" class="spinner"></span>

    </button>

    <p class="success" *ngIf="successMessage">
      ✅ Poruka je uspešno poslata!
    </p>

  </form>

</section>
